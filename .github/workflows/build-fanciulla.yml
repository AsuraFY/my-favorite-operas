name: Prepare La fanciulla del West — all three acts

on:
  workflow_dispatch:
  push:
    branches: [Update]
    paths:
      - scripts/import_fanciulla_all_acts.py
      - .github/workflows/build-fanciulla.yml

permissions:
  contents: write

jobs:
  prepare-three-acts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal HTML source parser
        run: python -m pip install 'beautifulsoup4==4.13.4'
      - name: Preflight all three Italian source acts (original page or same-page reader)
        run: python -u scripts/import_fanciulla_all_acts.py --preflight
      - name: Install offline Italian-English translation
        run: python -m pip install 'argostranslate==1.10.0'
      - name: Import all three Italian acts with paired English drafts
        run: python -u scripts/import_fanciulla_all_acts.py
      - name: Validate all operas and new content
        run: npm test
      - name: Commit verified three-act data to Update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/libretto-la-fanciulla-del-west-act-1.js src/data/libretto-la-fanciulla-del-west-act-2.js src/data/libretto-la-fanciulla-del-west-act-3.js src/data/libretto-la-fanciulla-del-west-bundle.js src/data/libretto-loader.js src/data/libretto-registry.js src/main.js src/boot.js index.html tests/fanciulla-del-west-complete.test.mjs tests/catalog-pages.test.mjs tests/lazy-libretto-loading.test.mjs tests/libretto-content.test.mjs tests/site-dependency-integrity.test.mjs docs/reviews/la-fanciulla-del-west-import-2026-10-26.md
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already committed'; exit 0; fi
          git commit -m 'Add all three acts of La fanciulla del West with bilingual drafts'
          git push origin HEAD:Update