name: Verify Update

on:
  push:
    branches: [Update]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete regression tests
        run: npm test
