name: Prepare Die Zauberflöte Act I (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-act-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline translation and parsing dependencies
        run: python -m pip install 'beautifulsoup4==4.13.4' 'argostranslate==1.10.0'
      - name: Import complete German Act I and draft line-paired English
        run: python scripts/import_die_zauberflote_act_1.py
      - name: Check Act I data and reader regression
        run: node --test tests/die-zauberflote-act-1.test.mjs
      - name: Run full regression suite
        run: npm test
      - name: Commit Act I to Update after successful checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/libretto-die-zauberflote-act-1.js src/data/libretto-die-zauberflote-bundle.js src/data/libretto-loader.js src/data/libretto-registry.js src/main.js tests/die-zauberflote-act-1.test.mjs
          git diff --cached --check
          git commit -m 'Add Die Zauberflöte Act I from Opera Guide with bilingual draft and tests'
          git push origin HEAD:Update