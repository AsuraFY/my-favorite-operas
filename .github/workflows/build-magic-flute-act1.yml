name: Prepare Die Zauberflöte Act I (one-time)

on:
  workflow_dispatch:
  push:
    branches: [Update]
    paths:
      - scripts/import_die_zauberflote_act_1.py
      - .github/workflows/build-magic-flute-act1.yml

permissions:
  contents: write

jobs:
  prepare-act-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline translation and parsing dependencies
        run: python -m pip install 'beautifulsoup4==4.13.4' 'argostranslate==1.10.0'
      - name: Import complete German Act I and draft line-paired English
        run: python scripts/import_die_zauberflote_act_1.py
      - name: Check Act I data and reader regression
        id: act_one_test
        run: |
          set -o pipefail
          node --test tests/die-zauberflote-act-1.test.mjs 2>&1 | tee /tmp/magic-flute-act1-test-output.txt
      - name: Record failed Act I diagnostic in Update
        if: failure() && steps.act_one_test.outcome == 'failure'
        run: |
          mkdir -p docs/reviews
          cp /tmp/magic-flute-act1-test-output.txt docs/reviews/magic-flute-act1-ci-last-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reviews/magic-flute-act1-ci-last-failure.txt
          git commit -m 'Record Magic Flute Act I regression diagnostic'
          git push origin HEAD:Update
      - name: Run full regression suite
        id: complete_test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/magic-flute-full-test-output.txt
      - name: Record failed full regression diagnostic
        if: failure() && steps.complete_test.outcome == 'failure'
        run: |
          mkdir -p docs/reviews
          cp /tmp/magic-flute-full-test-output.txt docs/reviews/magic-flute-full-ci-last-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reviews/magic-flute-full-ci-last-failure.txt
          git commit -m 'Record complete regression diagnostic for Magic Flute'
          git push origin HEAD:Update
      - name: Commit Act I to Update after successful checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/libretto-die-zauberflote-act-1.js src/data/libretto-die-zauberflote-bundle.js src/data/libretto-loader.js src/data/libretto-registry.js src/main.js src/boot.js index.html tests/die-zauberflote-act-1.test.mjs tests/lazy-libretto-loading.test.mjs tests/libretto-content.test.mjs tests/site-dependency-integrity.test.mjs tests/catalog-pages.test.mjs tests/browser-visual-smoke.mjs
          git diff --cached --check
          git commit -m 'Add Die Zauberflöte Act I from Opera Guide with bilingual draft and tests'
          git push origin HEAD:Update