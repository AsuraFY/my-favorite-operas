# ARCHIVED WORKFLOW — historical reference only. Not an active GitHub Actions workflow.
# The former Manon generation workflow has been retired; do not move this file
# back into .github/workflows without a separately approved redesign.
name: Validate historical Manon importer (read-only)

# This importer was a one-time content generator. No push trigger and no writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Safe source-import preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate legacy Python syntax without importing optional dependencies
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in sorted(Path('scripts').glob('import*.py')):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print('Syntax OK:', path)
          PY
      - name: Read-only preflight for already integrated librettos
        run: |
          python -B scripts/import-manon.py --check
          python -B scripts/import_die_zauberflote_act_1.py --check
          python -B scripts/import_die_zauberflote_act_2.py --check
          python -B scripts/import_fanciulla_all_acts.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite
        run: npm test
